<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04050e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Play · Twilight Tree</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌲</text></svg>">
<meta name="description" content="Play free browser games on Twilight Tree.">

<!-- Google AdSense — publisher ID -->
<script async
  data-ad-frequency-hint="30s"
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1923618182494890"
  crossorigin="anonymous"></script>

<script>
  window.adsbygoogle = window.adsbygoogle || [];
  var adBreak = adConfig = function(o) { adsbygoogle.push(o); };
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="play-body">

<header class="play-header">
  <button id="back-btn" class="icon-btn" aria-label="Back to arcade" title="Back">←</button>
  <div class="play-title" id="play-title">Loading…</div>
  <button id="fullscreen-btn" class="icon-btn" aria-label="Fullscreen" title="Fullscreen">⛶</button>
  <button id="share-btn" class="icon-btn" aria-label="Share" title="Share">↗</button>
</header>

<div class="play-frame-wrapper">
  <div class="play-loading" id="play-loading">
    <div class="spinner"></div>
    <span>Loading game…</span>
  </div>
  <iframe id="game-frame" src="about:blank"
          allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope"
          allowfullscreen
          title="Game"></iframe>
</div>

<script src="games.js"></script>
<script>
  'use strict';

  /* ============================================================
     PARSE ?id= FROM URL
     ============================================================ */
  const params = new URLSearchParams(window.location.search);
  const gameId = params.get('id');
  const game = window.GAMES.find(g => g.id === gameId);

  const titleEl = document.getElementById('play-title');
  const frame = document.getElementById('game-frame');
  const loading = document.getElementById('play-loading');
  const backBtn = document.getElementById('back-btn');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const shareBtn = document.getElementById('share-btn');

  /* ============================================================
     IFRAME FOCUS HANDLING
     ============================================================ */
  function focusGameFrame() {
    try {
      if (frame.contentWindow) {
        frame.contentWindow.focus();
        const doc = frame.contentDocument;
        if (doc) {
          const cvs = doc.querySelector('canvas');
          if (cvs && typeof cvs.focus === 'function') {
            cvs.setAttribute('tabindex', '0');
            cvs.focus();
          }
          if (!cvs && doc.body && typeof doc.body.focus === 'function') {
            doc.body.focus();
          }
        }
      }
    } catch (e) { /* cross-origin */ }
  }

  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'game-ready') focusGameFrame();
  });

  document.addEventListener('click', focusGameFrame, true);
  document.addEventListener('mousedown', focusGameFrame, true);
  document.addEventListener('touchstart', focusGameFrame, { passive: true, capture: true });
  document.addEventListener('pointerdown', focusGameFrame, true);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) setTimeout(focusGameFrame, 50);
  });
  window.addEventListener('focus', function () { setTimeout(focusGameFrame, 50); });
  window.addEventListener('resize', function () { setTimeout(focusGameFrame, 100); });
  window.addEventListener('orientationchange', function () { setTimeout(focusGameFrame, 250); });
  frame.addEventListener('mouseenter', focusGameFrame);

  function blurParentFocus() {
    const el = document.activeElement;
    if (el && el !== document.body && el !== frame && typeof el.blur === 'function') {
      el.blur();
    }
  }
  window.__focusGameFrame = focusGameFrame;

  /* ============================================================
     LOAD GAME
     ============================================================ */
  if (!game) {
    titleEl.textContent = 'Game Not Found';
    loading.innerHTML = '<span style="letter-spacing:2px;text-transform:uppercase;color:#8b93b8;font-size:0.8rem;">This game does not exist.</span>';
    frame.style.display = 'none';
  } else {
    document.title = game.title + ' · Twilight Tree';
    titleEl.textContent = game.title;

    blurParentFocus();
    frame.src = game.file;

    frame.addEventListener('load', function () {
      if (frame.src === 'about:blank') return;
      loading.classList.add('hidden');
      focusGameFrame();
      setTimeout(focusGameFrame, 100);
      setTimeout(focusGameFrame, 300);
      setTimeout(focusGameFrame, 700);
    });

    setTimeout(function () { loading.classList.add('hidden'); }, 6000);

    try {
      const KEY = 'twilighttree_recent';
      const MAX = 6;
      const raw = localStorage.getItem(KEY);
      let list = raw ? JSON.parse(raw) : [];
      list = list.filter(id => id !== game.id);
      list.unshift(game.id);
      list = list.slice(0, MAX);
      localStorage.setItem(KEY, JSON.stringify(list));
    } catch (e) {}
  }

  /* ============================================================
     BACK BUTTON
     ============================================================ */
  backBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    window.location.href = 'index.html';
  });

  /* ============================================================
     FULLSCREEN
     ============================================================ */
  fullscreenBtn.addEventListener('click', async function (e) {
    e.stopPropagation();
    try {
      const target = document.querySelector('.play-frame-wrapper');
      const isFull = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFull) {
        if (target.requestFullscreen) await target.requestFullscreen();
        else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
      setTimeout(focusGameFrame, 200);
    } catch (err) {}
  });

  document.addEventListener('fullscreenchange', function () {
    setTimeout(focusGameFrame, 200);
  });
  document.addEventListener('webkitfullscreenchange', function () {
    setTimeout(focusGameFrame, 200);
  });

  /* ============================================================
     SHARE
     ============================================================ */
  shareBtn.addEventListener('click', async function (e) {
    e.stopPropagation();
    const shareData = {
      title: game ? game.title + ' · Twilight Tree' : 'Twilight Tree',
      text: game ? 'Playing ' + game.title + ' on Twilight Tree!' : 'Check out Twilight Tree!',
      url: window.location.href
    };
    try {
      if (navigator.share) {
        await navigator.share(shareData);
      } else if (navigator.clipboard) {
        await navigator.clipboard.writeText(window.location.href);
        showToast('Link copied!');
      } else {
        prompt('Copy this link:', window.location.href);
      }
    } catch (err) {}
  });

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.classList.add('show'); });
    setTimeout(function () { t.classList.remove('show'); }, 1500);
    setTimeout(function () { t.remove(); }, 1900);
  }
</script>
</body>
</html>
