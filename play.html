<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Play · Twilight Tree</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌲</text></svg>">
<meta name="description" content="Play free browser games on Twilight Tree.">

<!-- Google AdSense — replace ca-pub-XXXXXXXXXXXXXXXX after approval -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1923618182494890" crossorigin="anonymous"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="play-body">

<header class="play-header">
  <button id="back-btn" class="icon-btn" aria-label="Back to arcade">←</button>
  <div class="play-title" id="play-title">Loading…</div>
  <button id="fullscreen-btn" class="icon-btn" aria-label="Fullscreen">⛶</button>
  <button id="share-btn" class="icon-btn" aria-label="Share">↗</button>
</header>

<div class="play-frame-wrapper">
  <div class="play-loading" id="play-loading">
    <div class="spinner"></div>
    <span>Loading game…</span>
  </div>
  <iframe id="game-frame" src="about:blank"
          allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope"
          allowfullscreen
          title="Game"></iframe>
</div>

<script src="games.js"></script>
<script>
  'use strict';

  /* ============================================================
     PARSE ?id= FROM URL
     ============================================================ */
  const params = new URLSearchParams(window.location.search);
  const gameId = params.get('id');
  const game = window.GAMES.find(g => g.id === gameId);

  const titleEl = document.getElementById('play-title');
  const frame = document.getElementById('game-frame');
  const loading = document.getElementById('play-loading');
  const backBtn = document.getElementById('back-btn');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const shareBtn = document.getElementById('share-btn');

  /* ============================================================
     IFRAME FOCUS HANDLING
     Keyboard events only reach the iframe when its window has
     focus. We aggressively grant focus on load, click, tap,
     visibility change, and via a message handshake with the game.
     ============================================================ */
  function focusGameFrame() {
    try {
      if (frame.contentWindow) {
        frame.contentWindow.focus();
        const doc = frame.contentDocument;
        if (doc) {
          const cvs = doc.querySelector('canvas');
          if (cvs && typeof cvs.focus === 'function') {
            cvs.setAttribute('tabindex', '0');
            cvs.focus();
          }
          // Also try the body if canvas isn't found
          if (!cvs && doc.body && typeof doc.body.focus === 'function') {
            doc.body.focus();
          }
        }
      }
    } catch (e) {
      // Cross-origin iframe — cannot focus directly
      console.warn('[Twilight Tree] Cannot focus iframe:', e);
    }
  }

  // When the game sends us a "game-ready" message, take focus
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'game-ready') {
      focusGameFrame();
    }
  });

  // Focus on any click/tap on the parent page (capture phase so it always runs)
  document.addEventListener('click', focusGameFrame, true);
  document.addEventListener('mousedown', focusGameFrame, true);
  document.addEventListener('touchstart', focusGameFrame, { passive: true, capture: true });
  document.addEventListener('pointerdown', focusGameFrame, true);

  // Focus when returning to the tab
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) setTimeout(focusGameFrame, 50);
  });

  // Focus on window focus (e.g. alt-tab back)
  window.addEventListener('focus', function () {
    setTimeout(focusGameFrame, 50);
  });

  // Focus on orientation change / resize
  window.addEventListener('resize', function () {
    setTimeout(focusGameFrame, 100);
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(focusGameFrame, 250);
  });

  // Focus when the iframe is entered with the mouse
  frame.addEventListener('mouseenter', focusGameFrame);

  // Belt-and-braces: blur any focused parent element so it stops
  // swallowing keyboard events meant for the game.
  function blurParentFocus() {
    const el = document.activeElement;
    if (el && el !== document.body && el !== frame && typeof el.blur === 'function') {
      el.blur();
    }
  }

  // Expose for debugging / manual invocation from console
  window.__focusGameFrame = focusGameFrame;

  /* ============================================================
     LOAD GAME
     ============================================================ */
  if (!game) {
    titleEl.textContent = 'Game Not Found';
    loading.innerHTML = '<span style="letter-spacing:2px;text-transform:uppercase;color:#8888aa;font-size:0.8rem;">This game does not exist.</span>';
    frame.style.display = 'none';
  } else {
    document.title = game.title + ' · Twilight Tree';
    titleEl.textContent = game.title;

    // Blur any focused parent element (e.g. the grid card that was clicked)
    blurParentFocus();

    // Load game into iframe
    frame.src = game.file;

    // When the iframe finishes loading: hide loading + grab focus
    frame.addEventListener('load', function () {
      if (frame.src === 'about:blank') return;
      loading.classList.add('hidden');

      // Multiple focus attempts — browsers sometimes need a beat to settle
      focusGameFrame();
      setTimeout(focusGameFrame, 100);
      setTimeout(focusGameFrame, 300);
      setTimeout(focusGameFrame, 700);
    });

    // Safety: force-hide loading after 6s
    setTimeout(function () { loading.classList.add('hidden'); }, 6000);

    // Record to "Recently Played"
    try {
      const KEY = 'twilighttree_recent';
      const MAX = 4;
      const raw = localStorage.getItem(KEY);
      let list = raw ? JSON.parse(raw) : [];
      list = list.filter(id => id !== game.id);
      list.unshift(game.id);
      list = list.slice(0, MAX);
      localStorage.setItem(KEY, JSON.stringify(list));
    } catch (e) {}
  }

  /* ============================================================
     BACK BUTTON
     ============================================================ */
  backBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    window.location.href = 'index.html';
  });

  /* ============================================================
     FULLSCREEN
     ============================================================ */
  fullscreenBtn.addEventListener('click', async function (e) {
    e.stopPropagation();
    try {
      const target = document.querySelector('.play-frame-wrapper');
      const isFull = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFull) {
        if (target.requestFullscreen) await target.requestFullscreen();
        else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
      // Ensure the game receives focus after fullscreen change
      setTimeout(focusGameFrame, 200);
    } catch (err) { /* user cancelled or not supported */ }
  });

  // Update fullscreen icon on change
  document.addEventListener('fullscreenchange', function () {
    fullscreenBtn.textContent = document.fullscreenElement ? '⛶' : '⛶';
    setTimeout(focusGameFrame, 200);
  });
  document.addEventListener('webkitfullscreenchange', function () {
    setTimeout(focusGameFrame, 200);
  });

  /* ============================================================
     SHARE
     ============================================================ */
  shareBtn.addEventListener('click', async function (e) {
    e.stopPropagation();
    const shareData = {
      title: game ? game.title + ' · Twilight Tree' : 'Twilight Tree',
      text: game ? 'Playing ' + game.title + ' on Twilight Tree!' : 'Check out Twilight Tree!',
      url: window.location.href
    };
    try {
      if (navigator.share) {
        await navigator.share(shareData);
      } else if (navigator.clipboard) {
        await navigator.clipboard.writeText(window.location.href);
        showToast('Link copied!');
      } else {
        prompt('Copy this link:', window.location.href);
      }
    } catch (err) { /* cancelled */ }
  });

  function showToast(msg) {
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = `
      position:fixed;top:70px;left:50%;transform:translateX(-50%);
      padding:0.6rem 1.2rem;background:rgba(0,240,255,0.15);
      border:1px solid #00f0ff;border-radius:50px;color:#00f0ff;
      font-family:'Orbitron',sans-serif;font-size:0.75rem;
      letter-spacing:2px;text-transform:uppercase;z-index:1000;
      backdrop-filter:blur(10px);box-shadow:0 0 25px rgba(0,240,255,0.4);
      transition:opacity 0.3s;
    `;
    document.body.appendChild(t);
    setTimeout(function () { t.style.opacity = '0'; }, 1500);
    setTimeout(function () { t.remove(); }, 1900);
  }
</script>
</body>
</html>
