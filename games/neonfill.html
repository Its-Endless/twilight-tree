function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const glyphCache = Object.create(null);
function getGlyph(ch, color){
  const key = color + '|' + ch;
  let c = glyphCache[key];
  if (c !== undefined) return c;
  const g = FONT[ch];
  if (!g){ glyphCache[key] = null; return null; }
  c = document.createElement('canvas'); c.width = 5; c.height = 7;
  const gx = c.getContext('2d'); gx.fillStyle = color;
  for (let r=0;r<7;r++) for (let col=0;col<5;col++) if (g[r][col] === '#') gx.fillRect(col,r,1,1);
  glyphCache[key] = c; return c;
}
function drawText(str, x, y, color, s){
  s = s || 1; str = String(str).toUpperCase();
  let cx = Math.round(x); y = Math.round(y);
  for (let i=0;i<str.length;i++){
    const img = getGlyph(str[i], color);
    if (img) ctx.drawImage(img, 0,0,5,7, cx, y, 5*s, 7*s);
    cx += 6*s;
  }
}
function textW(str, s){ s = s||1; return str.length*6*s - s; }
function drawTextC(str, cx, y, color, s){ s = s||1; drawText(str, cx - textW(str,s)/2, y, color, s); }

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function polyArea(p){
  let a = 0;
  for (let i=0;i<p.length;i++){ const q=p[i], r=p[(i+1)%p.length]; a += q.x*r.y - r.x*q.y; }
  return Math.abs(a)*0.5;
}
function pointInPoly(pt, poly){
  let inside = false;
  for (let i=0, j=poly.length-1; i<poly.length; j=i++){
    const xi=poly[i].x, yi=poly[i].y, xj=poly[j].x, yj=poly[j].y;
    if (((yi>pt.y)!==(yj>pt.y)) && (pt.x < (xj-xi)*(pt.y-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}
function raySeg(ox,oy,dx,dy, ax,ay,bx,by){
  const ex = bx-ax, ey = by-ay;
  const det = -dx*ey + ex*dy;
  if (Math.abs(det) < 1e-9) return -1;
  const fx = ax-ox, fy = ay-oy;
  const t = (ex*fy - ey*fx)/det;
  const u = (dx*fy - dy*fx)/det;
  if (t > 0 && u >= 0 && u <= 1) return t;
  return -1;
}
function closestOnSeg(px,py,ax,ay,bx,by){
  const vx=bx-ax, vy=by-ay; const L2 = vx*vx+vy*vy;
  let t = L2>0 ? ((px-ax)*vx + (py-ay)*vy)/L2 : 0;
  t = t<0?0:(t>1?1:t);
  return { x: ax+vx*t, y: ay+vy*t };
}
function distToSeg(px,py,ax,ay,bx,by){
  const c = closestOnSeg(px,py,ax,ay,bx,by);
  return Math.hypot(px-c.x, py-c.y);
}
function lerp(a,b,t){ return a + (b-a)*t; }

/* ---------- AUDIO ---------- */
const AudioSys = {
  ctx:null, master:null, sfxOn:true, musicOn:true, cutOsc:null, cutGain:null, musicTimer:null, musicStep:0,
  init(){
    if (this.ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.7;
      this.master.connect(this.ctx.destination);
    }catch(e){ this.ctx = null; }
  },
  resume(){ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(freq, dur, type, vol, delay){
    if (!this.sfxOn || !this.ctx) return;
    type = type||'square'; vol = vol===undefined?0.06:vol; delay = delay||0;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0+dur+0.03);
  },
  sweep(f0,f1,dur,type,vol){
    if (!this.sfxOn || !this.ctx) return;
    type = type||'square'; vol = vol===undefined?0.06:vol;
    const t0 = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0,t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), t0+dur);
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0+dur+0.03);
  },
  noise(dur, vol){
    if (!this.sfxOn || !this.ctx) return;
    const sr = this.ctx.sampleRate; const len = Math.floor(sr*dur);
    const buf = this.ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = vol===undefined?0.10:vol;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 900;
    src.connect(f); f.connect(g); g.connect(this.master); src.start();
  },
  startCut(){
    if (!this.sfxOn || !this.ctx || this.cutOsc) return;
    const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(90, this.ctx.currentTime);
    o.frequency.linearRampToValueAtTime(240, this.ctx.currentTime+0.5);
    g.gain.setValueAtTime(0.0001, this.ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.022, this.ctx.currentTime+0.06);
    o.connect(g); g.connect(this.master); o.start();
    this.cutOsc = o; this.cutGain = g;
  },
  stopCut(){
    if (!this.cutOsc) return;
    const t = this.ctx.currentTime;
    try{
      this.cutGain.gain.cancelScheduledValues(t);
      this.cutGain.gain.setValueAtTime(this.cutGain.gain.value, t);
      this.cutGain.gain.linearRampToValueAtTime(0.0001, t+0.07);
      this.cutOsc.stop(t+0.12);
    }catch(e){}
    this.cutOsc = null; this.cutGain = null;
  },
  startMusic(){
    if (this.musicTimer) return;
    const base = [196, 261.63, 329.63, 392, 329.63, 261.63];
    const layer2 = [392, 523.25, 659.25, 784, 659.25, 523.25];
    this.musicTimer = setInterval(()=>{
      if (!this.musicOn || !this.ctx) return;
      const s = G.state;
      if (s==='MENU'||s==='PLAYING'||s==='CUTTING'||s==='RETRACTING'||s==='FILLING'||s==='HOWTO'||s==='SETTINGS'||s==='PAUSED'||s==='LEADERBOARD'){
        const n = base[this.musicStep % base.length];
        this.tone(n, 0.55, 'triangle', 0.018, 0);
        if (this.musicStep % 3 === 0) this.tone(n/2, 0.8, 'sine', 0.014, 0);
        const layer = G.musicLayer | 0;
        if (layer >= 1 && this.musicStep % 2 === 0) this.tone(layer2[this.musicStep % layer2.length], 0.3, 'square', 0.010, 0.15);
        if (layer >= 2 && this.musicStep % 4 === 2) this.tone(base[(this.musicStep+2)%base.length]*2, 0.2, 'square', 0.008, 0.3);
        this.musicStep++;
      }
    }, 640);
  }
};

/* ---------- SHAPE GEN ---------- */
function genShape(cx, cy, R, level){
  const n = 24 + Math.floor(RNG()*7) + Math.min(10, level*2);
  const hcount = 2 + Math.min(4, Math.floor(level/2) + Math.floor(RNG()*2));
  const harms = [];
  for (let i=0;i<hcount;i++){
    const k = 2 + i + Math.floor(RNG()*2);
    const amp = (0.17/(i*0.75+1)) * (0.55+RNG()*0.85);
    const ph = RNG()*Math.PI*2;
    harms.push({k, amp, ph});
  }
  const pts = [];
  for (let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2;
    let r = 1;
    for (const h of harms) r += h.amp * Math.sin(h.k*a + h.ph);
    r = clamp(r, 0.58, 1.34);
    pts.push({ x: cx + Math.cos(a)*R*r, y: cy + Math.sin(a)*R*r*0.94 });
  }
  return pts;
}
function fitShape(pts, area){
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  for (const p of pts){
    if (p.x<minx)minx=p.x; if (p.x>maxx)maxx=p.x;
    if (p.y<miny)miny=p.y; if (p.y>maxy)maxy=p.y;
  }
  const sw = area.w/(maxx-minx), sh = area.h/(maxy-miny);
  const s = Math.min(sw, sh);
  const ox = area.x + area.w/2 - (minx+maxx)*0.5*s;
  const oy = area.y + area.h/2 - (miny+maxy)*0.5*s;
  return pts.map(p=>({ x: Math.round(p.x*s+ox), y: Math.round(p.y*s+oy) }));
}

function updatePolyMeta(){
  const p = G.poly, n = p.length;
  const cum = new Float64Array(n+1);
  let t = 0;
  for (let i=0;i<n;i++){
    const a=p[i], b=p[(i+1)%n];
    t += Math.hypot(b.x-a.x, b.y-a.y);
    cum[i+1] = t;
  }
  G.cum = cum; G.perim = t;
  G.playerSpeed = Math.max(46, t/6.2);
  G.curArea = polyArea(p);
}
function posAt(poly, cum, s){
  const n = poly.length;
  const total = cum[n];
  s = ((s % total) + total) % total;
  let i = 0;
  while (i < n-1 && cum[i+1] <= s) i++;
  const a = poly[i], b = poly[(i+1)%n];
  const segLen = cum[i+1]-cum[i];
  const t = segLen > 1e-9 ? (s-cum[i])/segLen : 0;
  const dx = b.x-a.x, dy = b.y-a.y;
  const l = Math.hypot(dx,dy) || 1;
  return { x:a.x+dx*t, y:a.y+dy*t, dx:dx/l, dy:dy/l, i:i, t:t };
}
function collectForward(pts, i0, i1){
  const n = pts.length; const out = [];
  let k = (i0+1)%n; let guard = 0;
  while (guard++ <= n+1){
    out.push(pts[k]);
    if (k === i1) break;
    k = (k+1)%n;
  }
  return out;
}
function computeArea(){
  AREA.x = 12; AREA.y = 44;
  AREA.w = Math.max(80, W - 24);

function enemyCompositionForLevel(level){
  if (level <= 1) return { floating: 1, static: 0 };
  if (level <= 2) return { floating: 2, static: 0 };
  if (level <= 4) return { floating: 2, static: 1 };
  if (level <= 6) return { floating: 3, static: 1 };
  if (level <= 9) return { floating: 3, static: 2 };
  if (level <= 12) return { floating: 4, static: 2 };
  return { floating: 4, static: 3 };
}
function enemySpeedForLevel(level){ return Math.min(120, 32 + level * 5.2); }
function isBossLevel(level){ return level % 5 === 0 && level > 0; }

function findSafeSpawn(poly, inner, minDistFromEdge, exclude, minSep){
  for (let tries=0; tries<500; tries++){
    const px = inner.x + RNG()*inner.w;
    const py = inner.y + RNG()*inner.h;
    if (!pointInPoly({x:px,y:py}, poly)) continue;
    let minD = 1e9;
    for (let i=0;i<poly.length;i++){
      const a=poly[i], b=poly[(i+1)%poly.length];
      minD = Math.min(minD, distToSeg(px,py,a.x,a.y,b.x,b.y));
    }
    if (minD < minDistFromEdge) continue;
    let ok = true;
    if (exclude){
      for (const ex of exclude){
        if (Math.hypot(px-ex.x, py-ex.y) < minSep){ ok = false; break; }
      }
    }
    if (!ok) continue;
    return {x:px, y:py};
  }
  for (let tries=0; tries<200; tries++){
    const px = inner.x + RNG()*inner.w;
    const py = inner.y + RNG()*inner.h;
    if (!pointInPoly({x:px,y:py}, poly)) continue;
    if (exclude){
      let ok = true;
      for (const ex of exclude){
        if (Math.hypot(px-ex.x, py-ex.y) < minSep*0.5){ ok = false; break; }
      }
      if (!ok) continue;
    }
    return {x:px, y:py};
  }
  let cx=0, cy=0;
  for (const p of poly){ cx+=p.x; cy+=p.y; }
  return {x:cx/poly.length, y:cy/poly.length};
}

function spawnWalls(level, poly, inner){
  if (level < 4) return [];
  const count = Math.min(3, 1 + Math.floor((level-4)/4));
  const walls = [];
  let tries = 0;
  while (walls.length < count && tries < 400){
    tries++;
    const p1 = findSafeSpawn(poly, inner, 26, null, 0);
    let p2 = null;
    for (let k=0; k<40; k++){
      const ang = RNG()*Math.PI*2;
      const len = 22 + RNG()*26;
      const tx = p1.x + Math.cos(ang)*len;
      const ty = p1.y + Math.sin(ang)*len;
      if (!pointInPoly({x:tx,y:ty}, poly)) continue;
      let mEdge = 1e9;
      for (let i=0;i<poly.length;i++){
        const a=poly[i], b=poly[(i+1)%poly.length];
        mEdge = Math.min(mEdge, distToSeg(tx,ty,a.x,a.y,b.x,b.y));
      }
      if (mEdge < 22) continue;
      p2 = {x:tx, y:ty};
      break;
    }
    if (!p2) continue;
    const mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
    let minEdge = 1e9;
    for (let i=0;i<poly.length;i++){
      const a=poly[i], b=poly[(i+1)%poly.length];
      minEdge = Math.min(minEdge, distToSeg(mx,my,a.x,a.y,b.x,b.y));
    }
    if (minEdge < 26) continue;
    let ok = true;
    for (const w of walls){
      const wmx = (w.x1+w.x2)/2, wmy = (w.y1+w.y2)/2;
      if (Math.hypot(mx-wmx, my-wmy) < 36) { ok = false; break; }
    }
    if (!ok) continue;
    walls.push({ x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y });
  }
  return walls;
}

function startLevel(level, opts){
  opts = opts || {};
  computeArea();
  G.level = level;
  G.fillTarget = Math.min(86, 55 + (level-1)*5);
  G.state = 'PLAYING';
  G.cut = null;
  G.fillAnim = null;
  G.timeScale = 1;
  G.slowFx = 0;
  G.invuln = 0.5;
  G.particles.length = 0;
  G.trail.length = 0;
  G.killFeed.length = 0;
  G.arrows = [{s:0, active:true}, {s:0, active:false}];
  G.activeArrow = 0;
  G.activeSlow = 0; G.activeShield = 0; G.activeFreeze = 0;
  G.powerUps.length = 0;
  G.bossActive = false;
  G.musicLayer = Math.min(3, Math.floor(level / 5));

  const inset = Math.min(W, H) * 0.06;
  const pad = 4;
  const inner = {
    x: AREA.x + pad + inset, y: AREA.y + pad + inset,
    w: AREA.w - (pad + inset)*2, h: AREA.h - (pad + inset)*2
  };

  if (opts.useSeed !== undefined) setSeed(opts.useSeed + level*9973);

  let pts = genShape(0,0,100, level);
  pts = fitShape(pts, inner);
  G.poly = pts;
  updatePolyMeta();
  G.levelStartArea = G.curArea;

  G.walls = spawnWalls(level, G.poly, inner);

  G.enemies.length = 0;
  const placed = [];
  const minEdge = Math.max(12, Math.min(18, Math.min(inner.w, inner.h) * 0.11));

  if (isBossLevel(level)){
    const speed = enemySpeedForLevel(level) * 0.7;
    const p = findSafeSpawn(G.poly, inner, 30, null, 0);
    placed.push(p);
    G.enemies.push({
      x:p.x, y:p.y, vx:Math.cos(RNG()*6.28)*speed, vy:Math.sin(RNG()*6.28)*speed,
      r:9, speed:speed, static:false, phase:RNG()*6.28, escapeGuard:0,
      hp:3, isBoss:true, maxHp:3
    });
    G.bossActive = true;
    const helperCount = 1 + Math.min(2, Math.floor(level/6));
    for (let i=0;i<helperCount;i++){
      const sp = findSafeSpawn(G.poly, inner, minEdge, placed, 40);
      placed.push(sp);
      const ang = RNG()*Math.PI*2;
      const s2 = enemySpeedForLevel(level);
      G.enemies.push({
        x:sp.x, y:sp.y, vx:Math.cos(ang)*s2, vy:Math.sin(ang)*s2,
        r:4.5, speed:s2, static:false, phase:RNG()*6.28, escapeGuard:0, hp:1
      });
    }
  } else {
    const comp = enemyCompositionForLevel(level);
    const speed = enemySpeedForLevel(level);
    const staticSep = Math.max(26, Math.min(inner.w, inner.h) * 0.22);
    for (let i=0;i<comp.static;i++){
      const p = findSafeSpawn(G.poly, inner, minEdge, placed, staticSep);
      placed.push(p);
      G.enemies.push({
        x:p.x, y:p.y, vx:0, vy:0,
        r:5.0, speed:0, static:true, phase:RNG()*6.28, hp:1
      });
    }
    const floatSep = Math.max(24, Math.min(inner.w, inner.h) / (comp.floating + 1.4));
    for (let i=0;i<comp.floating;i++){
      const p = findSafeSpawn(G.poly, inner, minEdge, placed, floatSep);
      placed.push(p);
      const ang = RNG()*Math.PI*2;
      G.enemies.push({
        x:p.x, y:p.y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
        r:4.5, speed:speed, static:false, phase:RNG()*6.28, escapeGuard:0, hp:1
      });
    }
  }

  G.player.s = 0;
  syncPlayer();
}
function syncPlayer(){
  const arrow = G.arrows[G.activeArrow];
  const p = posAt(G.poly, G.cum, arrow.s);
  G.player.s = arrow.s;
  G.player.x = p.x; G.player.y = p.y;
  G.player.angle = Math.atan2(p.dy, p.dx);
}
function inwardNormalAt(poly, i){
  const a = poly[i], b = poly[(i+1)%poly.length];
  const dx = b.x-a.x, dy = b.y-a.y;
  const l = Math.hypot(dx,dy) || 1;
  let nx = -(dy/l), ny = (dx/l);
  const mx = (a.x+b.x)*0.5, my = (a.y+b.y)*0.5;
  const off = Math.min(2.5, l*0.25);
  if (!pointInPoly({x:mx+nx*off, y:my+ny*off}, poly)){ nx = -nx; ny = -ny; }
  return { nx:nx, ny:ny };
}

function traceCut(ox, oy, dx, dy){
  const path = [{x:ox, y:oy}];
  let cx = ox, cy = oy, cdx = dx, cdy = dy;
  let bounces = 0;
  const MAX_BOUNCES = 4;
  for (let iter=0; iter<16; iter++){
    let bestT = Infinity, bestEdge = -1;
    for (let i=0;i<G.poly.length;i++){
      const A = G.poly[i], B = G.poly[(i+1)%G.poly.length];
      const t = raySeg(cx, cy, cdx, cdy, A.x, A.y, B.x, B.y);
      if (t > 1 && t < bestT){ bestT = t; bestEdge = i; }
    }
    let bestWT = Infinity, bestWIdx = -1;
    for (let w=0; w<G.walls.length; w++){
      const W = G.walls[w];
      const t = raySeg(cx, cy, cdx, cdy, W.x1, W.y1, W.x2, W.y2);
      if (t > 1 && t < bestWT){ bestWT = t; bestWIdx = w; }
    }
    if (bestEdge < 0) return null;
    if (bestWIdx >= 0 && bestWT < bestT - 0.5){
      if (bounces >= MAX_BOUNCES) return null;
      const hx = cx + cdx*bestWT;
      const hy = cy + cdy*bestWT;
      path.push({x:hx, y:hy, bounce:true});
      const W = G.walls[bestWIdx];
      let ex = W.x2 - W.x1, ey = W.y2 - W.y1;
      const el = Math.hypot(ex,ey)||1; ex/=el; ey/=el;
      const dot = cdx*ex + cdy*ey;
      cdx = 2*dot*ex - cdx;
      cdy = 2*dot*ey - cdy;
      cx = hx + cdx*0.4;
      cy = hy + cdy*0.4;
      bounces++;
    } else {
      const hx = cx + cdx*bestT;
      const hy = cy + cdy*bestT;
      path.push({x:hx, y:hy});
      return { path: path, endEdge: bestEdge, endX: hx, endY: hy, bounces: bounces };
    }
  }
  return null;
}
function computeCutPathLens(path){
  const cum = [0];
  for (let i=1;i<path.length;i++){
    const a = path[i-1], b = path[i];
    cum.push(cum[i-1] + Math.hypot(b.x-a.x, b.y-a.y));
  }
  return cum;
}
function getCutPos(cut, progress){
  const path = cut.path; const cum = cut.cum;
  const total = cum[cum.length-1];
  progress = clamp(progress, 0, total);
  let i = 0;
  while (i < path.length-2 && cum[i+1] <= progress) i++;
  const a = path[i], b = path[i+1];
  const segLen = cum[i+1]-cum[i];
  const t = segLen > 1e-9 ? (progress - cum[i])/segLen : 0;
  const dx = b.x-a.x, dy = b.y-a.y;
  const l = Math.hypot(dx,dy) || 1;
  return { x: a.x+dx*t, y: a.y+dy*t, dx: dx/l, dy: dy/l, i: i };
}

function launchCut(){
  if (G.state !== 'PLAYING' || G.poly.length < 3) return;
  const arrow = G.arrows[G.activeArrow];
  const p = posAt(G.poly, G.cum, arrow.s);
  const i0 = p.i;
  const nrm = inwardNormalAt(G.poly, i0);

  const trace = traceCut(p.x, p.y, nrm.nx, nrm.ny);
  if (!trace) {
    AudioSys.tone(200, 0.08, 'square', 0.04);
    return;
  }

  const cum = computeCutPathLens(trace.path);
  const totalLen = cum[cum.length-1];

  G.cut = {
    path: trace.path, cum: cum, totalLen: totalLen,
    progress: 0,
    ox: p.x, oy: p.y,
    i0: i0, i1: trace.endEdge,
    endX: trace.endX, endY: trace.endY,
    s0: arrow.s,
    hit: false,
    bounces: trace.bounces,
  };
  G.state = 'CUTTING';
  G.timeScale = 1;
  G.trail.length = 0;
  AudioSys.startCut();
  AudioSys.tone(660, 0.06, 'square', 0.045);
}

function releaseCut(){
  if (G.state !== 'CUTTING') return;
  G.state = 'RETRACTING';
  AudioSys.stopCut();
  AudioSys.tone(300, 0.08, 'square', 0.035);
}

function completeCut(){
  const c = G.cut;
  const poly = G.poly;
  const L = { x:c.ox, y:c.oy };
  const D = { x:c.endX, y:c.endY };
  const i0 = c.i0, i1 = c.i1;

  const bounces = [];
  for (let i=1;i<c.path.length-1;i++) bounces.push(c.path[i]);

  const fwd = (i0 === i1) ? [] : collectForward(poly, i0, i1);
  const bwd = collectForward(poly, i1, i0);

  const pathA = [L, ...fwd, D];
  for (let i=bounces.length-1; i>=0; i--) pathA.push(bounces[i]);
  const pathB = [D, ...bwd, L];
  for (let i=0; i<bounces.length; i++) pathB.push(bounces[i]);

  const areaA = polyArea(pathA);
  const areaB = polyArea(pathB);

  let countA = 0, countB = 0;
  for (const e of G.enemies){
    const a = pointInPoly({x:e.x, y:e.y}, pathA);
    const b = pointInPoly({x:e.x, y:e.y}, pathB);
    if (a && !b) countA++;
    else if (b && !a) countB++;
    else if (a && b) countA++;
  }

  let keep, fill, fillArea;
  if (countA > countB){ keep = pathA; fill = pathB; fillArea = areaB; }
  else if (countB > countA){ keep = pathB; fill = pathA; fillArea = areaA; }
  else if (areaA >= areaB){ keep = pathA; fill = pathB; fillArea = areaB; }
  else { keep = pathB; fill = pathA; fillArea = areaA; }

  if (keep.length < 3){ keep = (keep === pathA) ? pathB : pathA; }

  G.poly = keep;
  const di = Math.max(0, keep.indexOf(D));
  updatePolyMeta();
  const sPos = G.cum[di] || 0;
  G.arrows[G.activeArrow].s = sPos;
  syncPlayer();

  const baseGain = Math.round((fillArea / Math.max(1,G.levelStartArea)) * 900) + 40;

  const now = G.t;
  if (now - (G.lastCutTime || 0) < 2.5) G.combo++;
  else G.combo = 1;
  G.lastCutTime = now;
  G.comboTimer = 2.5;
  if (G.combo > G.comboMax) G.comboMax = G.combo;

  let mult = 1 + Math.min(2.0, Math.floor(G.combo/3) * 0.5);
  G.scoreMult = mult;

  let perfect = false;
  let perfectDist = Infinity;
  for (const e of G.enemies){
    for (let i=1;i<c.path.length;i++){
      const a = c.path[i-1], b = c.path[i];
      const d = distToSeg(e.x, e.y, a.x, a.y, b.x, b.y);
      if (d < perfectDist) perfectDist = d;
    }
  }
  if (perfectDist < 3.5 && perfectDist > 2.6) perfect = true;

  let gained = baseGain * mult;
  if (perfect){ gained += 200; G.perfectStreak++; }
  else G.perfectStreak = 0;
  gained = Math.round(gained);
  G.score += gained;

  if (perfect){ G.perfectFlash = 1.0; addFeed('PERFECT! +200', TH().warning); }
  if (G.combo >= 3) addFeed('COMBO x' + G.combo + ' (' + mult.toFixed(1) + 'x)', TH().primary);
  addFeed('+' + gained, TH().warning);

  const steps = Math.max(6, Math.floor(c.totalLen/9));
  for (let i=0;i<steps;i++){
    const t = i/steps;
    const pp = getCutPos(c, c.totalLen * t);
    spawnParticles(pp.x, pp.y, 1, TH().warning, 40);
  }
  for (const b of bounces) spawnParticles(b.x, b.y, 6, TH().secondary, 60);
  spawnParticles(D.x, D.y, 10, TH().primary, 70);

  let killedCount = 0;
  const survivors = [];
  for (const e of G.enemies){
    if (pointInPoly({x:e.x, y:e.y}, G.poly)){
      let minD = 1e9;
      for (let i=0;i<G.poly.length;i++){
        const a=G.poly[i], b=G.poly[(i+1)%G.poly.length];
        minD = Math.min(minD, distToSeg(e.x,e.y,a.x,a.y,b.x,b.y));
      }
      if (minD < e.r + 2){
        let cx=0, cy=0;
        for (const q of G.poly){ cx+=q.x; cy+=q.y; }
        cx /= G.poly.length; cy /= G.poly.length;
        const dx = cx-e.x, dy = cy-e.y;
        const dl = Math.hypot(dx,dy) || 1;
        e.x += dx/dl * (e.r + 3 - minD);
        e.y += dy/dl * (e.r + 3 - minD);
      }
      survivors.push(e);
    } else {
      killedCount++;
      spawnParticles(e.x, e.y, 18, TH().danger, 120);
      spawnParticles(e.x, e.y, 8, TH().warning, 80);
      if (Math.random() < 0.55) spawnPowerUp(e.x, e.y);
      if (e.isBoss) G.bossActive = false;
    }
  }
  G.enemies = survivors;

  if (killedCount >= 1){
    addFeed('KILL x' + killedCount, TH().danger);
    G.shake = Math.max(G.shake, 0.4 + killedCount * 0.25);
  }

  G.fillAnim = { poly: fill, t: 0 };
  G.state = 'FILLING';
  G.flashWhite = 0.6;
  G.cut = null;
  AudioSys.stopCut();
  AudioSys.tone(523, 0.09, 'square', 0.06);
  AudioSys.tone(784, 0.12, 'square', 0.06, 0.07);
  AudioSys.tone(1046, 0.16, 'square', 0.05, 0.15);
}

function addFeed(text, color){
  G.killFeed.push({ text, color, life: 1.6, max: 1.6 });
  if (G.killFeed.length > 4) G.killFeed.shift();
}
function spawnPowerUp(x, y){
  const types = ['SLOW', 'SHIELD', 'FREEZE'];
  const type = types[Math.floor(Math.random()*types.length)];
  G.powerUps.push({ x, y, type, life: 12, phase: Math.random()*6.28, r: 6 });
}
function applyPowerUp(type){
  if (type === 'SLOW'){ G.activeSlow = 5.0; addFeed('SLOW-MO', TH().secondary); }
  else if (type === 'SHIELD'){ G.activeShield = 8.0; addFeed('SHIELD', TH().primary); }
  else if (type === 'FREEZE'){ G.activeFreeze = 3.0; addFeed('FREEZE', TH().warning); }
  AudioSys.tone(880, 0.09, 'square', 0.06);
  AudioSys.tone(1318, 0.12, 'square', 0.06, 0.08);
}
function updatePowerUps(dt){
  for (let i=G.powerUps.length-1;i>=0;i--){
    const p = G.powerUps[i];
    p.life -= dt; p.phase += dt*3;
    if (p.life <= 0){ G.powerUps.splice(i,1); continue; }
    if (Math.hypot(p.x - G.player.x, p.y - G.player.y) < p.r + 5){
      applyPowerUp(p.type);
      spawnParticles(p.x, p.y, 10, TH().primary, 80);
      G.powerUps.splice(i,1);
    }
  }
}

function onHit(){
  if (G.activeShield > 0){
    G.activeShield = 0;
    G.shieldFlash = 1.0;
    AudioSys.tone(1200, 0.15, 'square', 0.07);
    spawnParticles(G.player.x, G.player.y, 16, TH().primary, 100);
    if (G.cut){ G.state = 'RETRACTING'; G.cut.hit = true; }
    addFeed('SHIELD!', TH().primary);
    return;
  }
  G.lives--;
  G.combo = 0; G.comboTimer = 0;
  G.shake = 1.0; G.hitFlash = 1.0; G.invuln = 2.0;
  AudioSys.stopCut();
  AudioSys.noise(0.25, 0.13);
  AudioSys.sweep(320, 60, 0.3, 'square', 0.08);
  spawnParticles(G.player.x, G.player.y, 22, TH().danger, 110);
  addFeed('HIT!', TH().danger);

  if (G.cut){
    G.state = 'RETRACTING';
    G.cut.hit = true;
  } else {
    for (const e of G.enemies){
      if (e.static) continue;
      const dx = e.x - G.player.x, dy = e.y - G.player.y;
      const dl = Math.hypot(dx, dy) || 1;
      e.vx = dx/dl * e.speed; e.vy = dy/dl * e.speed;
      e.x += dx/dl * 10; e.y += dy/dl * 10;
      if (!pointInPoly({x:e.x,y:e.y}, G.poly)){
        let cx=0, cy=0;
        for (const q of G.poly){ cx+=q.x; cy+=q.y; }
        cx /= G.poly.length; cy /= G.poly.length;
        const ddx = cx-e.x, ddy = cy-e.y;
        const ddl = Math.hypot(ddx,ddy) || 1;
        e.x += ddx/ddl * 5; e.y += ddy/ddl * 5;
      }
    }
    if (G.lives <= 0){ gameOver(); return; }
    G.state = 'PLAYING';
  }
}

function gameOver(){
  // ============================================================
  //  SNAPSHOT for potential ad-revive

  reviveSnapshot = {
    level: G.level,
    score: G.score,
    comboMax: G.comboMax,

  }

    }

function loadLeaderboard(){
  try{
    const raw = localStorage.getItem('neonfill_lb');
    if (!raw) return [];
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    return arr.slice(0,5);
  }catch(e){ return []; }
}
function addLeaderboardScore(score, level){
  try{
    const lb = loadLeaderboard();
    lb.push({ score, level, date: new Date().toISOString().slice(0,10) });
    lb.sort((a,b)=>b.score - a.score);
    localStorage.setItem('neonfill_lb', JSON.stringify(lb.slice(0,5)));
  }catch(e){}
}

/* ============================================================
   COLLISION — ONLY against the DRAWN portion of the cut path.
   ============================================================ */
function checkCutCollisions(){
  if (G.invuln > 0) return false;
  if (G.state !== 'CUTTING') return false;
  if (!G.cut) return false;

  const c = G.cut;
  const px = G.player.x, py = G.player.y;
  const cump = c.cum;

  for (const e of G.enemies){
    if (Math.hypot(e.x - px, e.y - py) < e.r + 2.5){
      if (e.isBoss && e.hp > 1){
        e.hp--;
        spawnParticles(e.x, e.y, 12, TH().danger, 90);
        addFeed('BOSS -1 HP', TH().danger);
        G.shake = Math.max(G.shake, 0.6);
        if (G.cut){ G.state = 'RETRACTING'; G.cut.hit = true; }
        return false;
      } else {
        onHit(); return true;
      }
    }
    let hitLine = false;
    for (let i=1; i<c.path.length; i++){
      const segStart = cump[i-1];
      const segEnd = cump[i];
      if (segStart >= c.progress - 0.01) break;
      const a = c.path[i-1];
      const b = c.path[i];
      let bx = b.x, by = b.y;
      if (segEnd > c.progress){
        const tt = (c.progress - segStart) / Math.max(0.0001, segEnd - segStart);
        bx = a.x + (b.x - a.x) * tt;
        by = a.y + (b.y - a.y) * tt;
      }
      const d = distToSeg(e.x, e.y, a.x, a.y, bx, by);
      if (d < e.r + 2.2){ hitLine = true; break; }
    }
    if (hitLine){
      if (e.isBoss && e.hp > 1){
        e.hp--;
        spawnParticles(e.x, e.y, 12, TH().danger, 90);
        addFeed('BOSS -1 HP', TH().danger);
        G.shake = Math.max(G.shake, 0.6);
        if (G.cut){ G.state = 'RETRACTING'; G.cut.hit = true; }
        return false;
      } else {
        onHit(); return true;
      }
    }
  }
  return false;
}

function spawnParticles(x,y,n,color,spd){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const s = (spd||70)*(0.25+Math.random());
    G.particles.push({
      x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:0.35+Math.random()*0.5, max:0.85,
      color:color, size: Math.random()<0.4 ? 2 : 1
    });
  }
  if (G.particles.length > 360) G.particles.splice(0, G.particles.length-360);
}
function updateParticles(dt){
  for (let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += 90*dt; p.vx *= (1 - 2.2*dt);
    p.life -= dt;
    if (p.life <= 0) G.particles.splice(i,1);
  }
}

function moveOneEnemy(e, dt){
  if (e.static) return;
  if (dt <= 0) return;
  let speedMult = 1;
  if (G.activeFreeze > 0) speedMult = 0;
  else if (G.activeSlow > 0) speedMult = 0.4;
  dt *= speedMult;
  if (dt <= 0) return;

  let nx = e.x + e.vx*dt;
  let ny = e.y + e.vy*dt;

  if (!pointInPoly({x:nx,y:ny}, G.poly)){
    let best = null, bestD = Infinity;
    for (let i=0;i<G.poly.length;i++){
      const a=G.poly[i], b=G.poly[(i+1)%G.poly.length];
      const c = closestOnSeg(nx,ny,a.x,a.y,b.x,b.y);
      const d = (c.x-nx)*(c.x-nx) + (c.y-ny)*(c.y-ny);
      if (d < bestD){ bestD = d; best = c; }
    }
    if (best){
      let nxn = nx-best.x, nyn = ny-best.y;
      const nl = Math.hypot(nxn,nyn) || 1;
      nxn/=nl; nyn/=nl;
      const dot = e.vx*nxn + e.vy*nyn;
      if (dot > 0){ e.vx -= 2*dot*nxn; e.vy -= 2*dot*nyn; }
      nx = best.x - nxn*(e.r+1.2);
      ny = best.y - nyn*(e.r+1.2);
      if (!pointInPoly({x:nx,y:ny}, G.poly)){
        nx = e.x; ny = e.y;
        e.vx = -e.vx; e.vy = -e.vy;
        e.escapeGuard = (e.escapeGuard||0) + 1;
      } else e.escapeGuard = 0;
    }
  } else e.escapeGuard = 0;

  e.x = nx; e.y = ny;

  if (e.escapeGuard > 8){
    let cx=0, cy=0;
    for (const p of G.poly){ cx+=p.x; cy+=p.y; }
    e.x = cx/G.poly.length; e.y = cy/G.poly.length;
    e.escapeGuard = 0;
  }
  const sp = Math.hypot(e.vx,e.vy);
  if (sp > 0.001){ e.vx = e.vx/sp*e.speed; e.vy = e.vy/sp*e.speed; }
}
function moveEnemies(dt){
  if (dt <= 0) return;
  for (const e of G.enemies) moveOneEnemy(e, dt);
}

function tick(dt){
  G.t += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt*3.2);
  if (G.hitFlash > 0) G.hitFlash = Math.max(0, G.hitFlash - dt*3.0);
  if (G.flashWhite > 0) G.flashWhite = Math.max(0, G.flashWhite - dt*4);
  if (G.invuln > 0) G.invuln = Math.max(0, G.invuln - dt);
  if (G.perfectFlash > 0) G.perfectFlash = Math.max(0, G.perfectFlash - dt*2);
  if (G.shieldFlash > 0) G.shieldFlash = Math.max(0, G.shieldFlash - dt*2);
  if (G.comboTimer > 0){ G.comboTimer -= dt; if (G.comboTimer <= 0) G.combo = 0; }
  if (G.activeSlow > 0) G.activeSlow = Math.max(0, G.activeSlow - dt);
  if (G.activeShield > 0) G.activeShield = Math.max(0, G.activeShield - dt);
  if (G.activeFreeze > 0) G.activeFreeze = Math.max(0, G.activeFreeze - dt);
  if (G.challengeMode && G.state !== 'GAME_OVER' && G.state !== 'MENU'){
    if (G.state === 'PLAYING' || G.state === 'CUTTING' || G.state === 'RETRACTING' || G.state === 'FILLING' || G.state === 'LEVEL_CLEAR'){
      G.challengeTimer -= dt;
      if (G.challengeTimer <= 0){ G.challengeTimer = 0; gameOver(); return; }
    }
  }

  for (let i=G.killFeed.length-1;i>=0;i--){
    G.killFeed[i].life -= dt;
    if (G.killFeed[i].life <= 0) G.killFeed.splice(i,1);
  }
  for (let i=G.achToasts.length-1;i>=0;i--){
    G.achToasts[i].life -= dt;
    if (G.achToasts[i].life <= 0) G.achToasts.splice(i,1);
  }

  if (G.state === 'MENU' || G.state === 'HOWTO' || G.state === 'SETTINGS' || G.state === 'LEADERBOARD'){
    moveEnemies(dt*0.85);
    updateParticles(dt);
    return;
  }
  if (G.state === 'PAUSED'){ return; }
  if (G.state === 'GAME_OVER'){ updateParticles(dt); return; }

  if (G.state === 'LEVEL_CLEAR'){
    G.levelClearT += dt;
    updateParticles(dt);
    if (Math.random() < 0.4){
      spawnParticles(AREA.x + Math.random()*AREA.w, AREA.y + Math.random()*AREA.h, 1,
        [TH().primary, TH().secondary, TH().warning][Math.floor(Math.random()*3)], 50);
    }
    if (G.levelClearT > 2.0){
      G.level++;
      G.lives = Math.min(3, G.lives + (G.level % 3 === 0 ? 1 : 0));
      startLevel(G.level);
    }
    return;
  }

  if (G.state === 'FILLING'){
    G.fillAnim.t += dt*2.6;
    updateParticles(dt);
    if (Math.random() < 0.6 && G.fillAnim.poly.length){
      const pp = G.fillAnim.poly[Math.floor(Math.random()*G.fillAnim.poly.length)];
      spawnParticles(pp.x, pp.y, 1, TH().primary, 30);
    }
    if (G.fillAnim.t >= 1){
      G.fillAnim = null;
      const pct = levelFillPct();
      if (pct >= G.fillTarget){
        G.state = 'LEVEL_CLEAR';
        G.levelClearT = 0;
        G.score += 400 + G.level*120;
        AudioSys.tone(659,0.1,'square',0.06);
        AudioSys.tone(880,0.1,'square',0.06,0.1);
        AudioSys.tone(1175,0.22,'square',0.06,0.2);
      } else {
        G.state = 'PLAYING';
      }
    }
    return;
  }

  let targetTs = 1;
  if (G.state === 'CUTTING' && G.cut){
    const c = G.cut;
    let minD = Infinity;
    for (const e of G.enemies){
      for (let i=1;i<c.path.length;i++){
        const a = c.path[i-1], b = c.path[i];
        const d = distToSeg(e.x, e.y, a.x, a.y, b.x, b.y);
        if (d < minD) minD = d;
      }
    }
    const dangerR = 6;
    const warnR = 68;
    if (minD < warnR){
      const k = clamp((minD - dangerR) / (warnR - dangerR), 0, 1);
      targetTs = 0.12 + 0.88*k;
    }
  }
  const smooth = 1 - Math.pow(0.0015, dt);
  G.timeScale = lerp(G.timeScale, targetTs, smooth);
  if (G.timeScale < 0.03) G.timeScale = 0.03;

  const slowActive = targetTs < 0.85;
  G.slowFx = lerp(G.slowFx, slowActive ? 1 : 0, 1-Math.pow(0.002,dt));

  if (slowActive){
    G.warnBeep += dt;
    if (G.warnBeep > 0.42){ G.warnBeep = 0; AudioSys.tone(1400, 0.045, 'square', 0.028); }
  } else G.warnBeep = 0;

  const ts = G.timeScale * (G.activeFreeze > 0 ? 0.0 : 1.0);

  if (G.state === 'PLAYING'){
    const arrow = G.arrows[G.activeArrow];
    arrow.s += G.playerSpeed * dt;
    syncPlayer();
    G.trail.push({x:G.player.x, y:G.player.y, life:0.35});
    if (G.trail.length > 14) G.trail.shift();
  }
  for (let i=G.trail.length-1;i>=0;i--){
    G.trail[i].life -= dt;
    if (G.trail[i].life <= 0) G.trail.splice(i,1);
  }

  moveEnemies(dt * (G.state === 'RETRACTING' ? 1.0 : ts));
  updatePowerUps(dt);

  if (G.state === 'CUTTING'){
    const c = G.cut;
    c.progress += 240 * dt * ts;
    if (c.progress > c.totalLen) c.progress = c.totalLen;
    const pp = getCutPos(c, c.progress);
    G.player.x = pp.x; G.player.y = pp.y;
    G.player.angle = Math.atan2(pp.dy, pp.dx);

    if (Math.random() < 0.75) spawnParticles(pp.x, pp.y, 1, TH().warning, 22);

    if (checkCutCollisions()) return;

    if (c.progress >= c.totalLen - 0.01){ completeCut(); return; }
  }

  if (G.state === 'RETRACTING'){
    const c = G.cut;
    if (!c){ G.state = 'PLAYING'; }
    else {
      c.progress -= 900 * dt;
      if (c.progress <= 0){
        c.progress = 0;
        G.arrows[G.activeArrow].s = c.s0;
        G.cut = null;
        syncPlayer();
        if (G.lives <= 0){ gameOver(); return; }
        G.state = 'PLAYING';
      } else {
        const pp = getCutPos(c, c.progress);
        G.player.x = pp.x; G.player.y = pp.y;
        G.player.angle = Math.atan2(-pp.dy, -pp.dx);
        if (Math.random() < 0.5) spawnParticles(pp.x, pp.y, 1, TH().secondary, 20);
      }
    }
  }

  updateParticles(dt);
}

function levelFillPct(){
  const pct = (1 - G.curArea/Math.max(1,G.levelStartArea)) * 100;
  return clamp(pct, 0, 100);
}

let gridCanvas = null;
function buildGrid(){
  gridCanvas = document.createElement('canvas');
  gridCanvas.width = W; gridCanvas.height = H;
  const g = gridCanvas.getContext('2d'); const t = TH();
  g.fillStyle = t.grid + '0.055)';
  for (let x=0;x<W;x+=8) g.fillRect(x,0,1,H);
  for (let y=0;y<H;y+=8) g.fillRect(0,y,W,1);
  g.fillStyle = t.grid + '0.09)';
  for (let x=0;x<W;x+=32) g.fillRect(x,0,1,H);
  for (let y=0;y<H;y+=32) g.fillRect(0,y,W,1);
}
let patternFill = null;
function buildPatterns(){
  const t = TH();
  const c1 = document.createElement('canvas'); c1.width=4; c1.height=4;
  const g1 = c1.getContext('2d');
  g1.fillStyle = t.primary; g1.fillRect(0,0,2,2); g1.fillRect(2,2,2,2);
  patternFill = ctx.createPattern(c1,'repeat');
}
function applyTheme(){
  document.body.style.background = TH().bg;
  buildGrid(); buildPatterns();
}

function resize(){
  const vw = Math.max(200, window.innerWidth);
  const vh = Math.max(240, window.innerHeight);
  let s = Math.round(vh/420);
  s = clamp(s, 2, 5);
  while (vw/s < 170 && s > 1) s--;
  SCALE = s;
  W = Math.max(170, Math.round(vw/SCALE));
  H = Math.max(240, Math.round(vh/SCALE));
  canvas.width = W; canvas.height = H;
  canvas.style.width = (W*SCALE)+'px';
  canvas.style.height = (H*SCALE)+'px';
  ctx.imageSmoothingEnabled = false;
  buildGrid(); buildPatterns(); computeArea();
  if (G.poly && G.poly.length >= 3) refitWorld();
}
function refitWorld(){
  const inset = Math.min(W, H) * 0.06;
  const inner = { x: AREA.x + 4 + inset, y: AREA.y + 4 + inset,
    w: AREA.w - (4 + inset)*2, h: AREA.h - (4 + inset)*2 };
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  for (const p of G.poly){
    if (p.x<minx)minx=p.x; if (p.x>maxx)maxx=p.x;
    if (p.y<miny)miny=p.y; if (p.y>maxy)maxy=p.y;
  }
  const bw = Math.max(1,maxx-minx), bh = Math.max(1,maxy-miny);
  const s = Math.min(inner.w/bw, inner.h/bh);
  const ox = inner.x + inner.w/2 - (minx+maxx)*0.5*s;
  const oy = inner.y + inner.h/2 - (miny+maxy)*0.5*s;
  for (const p of G.poly){ p.x = p.x*s+ox; p.y = p.y*s+oy; }
  for (const e of G.enemies){ e.x = e.x*s+ox; e.y = e.y*s+oy; e.speed *= Math.sqrt(s); }
  for (const w of G.walls){ w.x1 = w.x1*s+ox; w.y1 = w.y1*s+oy; w.x2 = w.x2*s+ox; w.y2 = w.y2*s+oy; }
  for (const pw of G.powerUps){ pw.x = pw.x*s+ox; pw.y = pw.y*s+oy; }
  for (const a of G.arrows){ a.s *= s; }
  G.levelStartArea *= s*s;
  if (G.cut){
    G.cut.ox = G.cut.ox*s+ox; G.cut.oy = G.cut.oy*s+oy;
    for (const p of G.cut.path){ p.x = p.x*s+ox; p.y = p.y*s+oy; }
    G.cut.cum = computeCutPathLens(G.cut.path);
    G.cut.totalLen = G.cut.cum[G.cut.cum.length-1];
    G.cut.progress *= s;
    G.cut.endX = G.cut.endX*s+ox; G.cut.endY = G.cut.endY*s+oy;
    G.cut.s0 *= s;
  }
  if (G.fillAnim){ for (const p of G.fillAnim.poly){ p.x = p.x*s+ox; p.y = p.y*s+oy; } }
  updatePolyMeta();
  syncPlayer();
}

function pathPoly(p){
  ctx.beginPath(); ctx.moveTo(p[0].x, p[0].y);
  for (let i=1;i<p.length;i++) ctx.lineTo(p[i].x, p[i].y);
  ctx.closePath();
}
function render(){
  const shakeX = G.shake>0 ? (Math.random()-0.5)*G.shake*7 : 0;
  const shakeY = G.shake>0 ? (Math.random()-0.5)*G.shake*7 : 0;
  ctx.save(); ctx.translate(Math.round(shakeX), Math.round(shakeY));
  ctx.fillStyle = TH().bg; ctx.fillRect(-20,-20,W+40,H+40);
  drawBackdropStars();

  if (G.state === 'MENU'){ drawMenu(); }
  else if (G.state === 'HOWTO'){ drawHowTo(); }
  else if (G.state === 'SETTINGS'){ drawSettings(); }
  else if (G.state === 'LEADERBOARD'){ drawLeaderboard(); }
  else if (G.state === 'GAME_OVER'){ drawWorld(0.35); drawGameOver(); }
  else {
    drawWorld(1);
    drawHUD();
    if (G.state === 'LEVEL_CLEAR') drawLevelClear();
    if (G.state === 'PAUSED') drawPauseMenu();
  }
  ctx.restore();

  if (G.hitFlash > 0){ ctx.fillStyle = 'rgba(255,56,100,'+(G.hitFlash*0.32)+')'; ctx.fillRect(0,0,W,H); }
  if (G.flashWhite > 0){ ctx.fillStyle = 'rgba(244,244,244,'+(G.flashWhite*0.22)+')'; ctx.fillRect(0,0,W,H); }
  if (G.perfectFlash > 0){ ctx.fillStyle = 'rgba(255,212,71,'+(G.perfectFlash*0.20)+')'; ctx.fillRect(0,0,W,H); }
  if (G.shieldFlash > 0){ ctx.fillStyle = 'rgba(57,255,136,'+(G.shieldFlash*0.15)+')'; ctx.fillRect(0,0,W,H); }
  if (G.slowFx > 0.05){ ctx.fillStyle = 'rgba(53,199,255,'+(G.slowFx*0.055)+')'; ctx.fillRect(0,0,W,H); }
  if (G.activeFreeze > 0){ ctx.fillStyle = 'rgba(180,220,255,'+(0.05 + Math.sin(G.t*8)*0.02)+')'; ctx.fillRect(0,0,W,H); }
  if (G.activeSlow > 0){ ctx.fillStyle = 'rgba(53,199,255,'+(0.04 + Math.sin(G.t*5)*0.015)+')'; ctx.fillRect(0,0,W,H); }

  drawKillFeed();
  drawAchToasts();
}
const stars = [];
for (let i=0;i<48;i++) stars.push({ x:Math.random(), y:Math.random(), s:Math.random()<0.85?1:2, v:0.004+Math.random()*0.012, a:0.05+Math.random()*0.18 });
function drawBackdropStars(){
  const t = TH();
  for (const st of stars){
    let yy = (st.y + G.t*st.v) % 1;
    const xx = Math.round(st.x*W);
    ctx.fillStyle = t.grid + st.a + ')';
    ctx.fillRect(xx, Math.round(yy*H), st.s, st.s);
  }
}

function drawWorld(dim){
  if (!G.poly || G.poly.length < 3) return;
  const t = TH();
  ctx.save(); if (dim < 1) ctx.globalAlpha = dim;

  pathPoly(G.poly); ctx.fillStyle = t.areaFill; ctx.fill();

  ctx.save(); pathPoly(G.poly); ctx.clip();
  if (gridCanvas) ctx.drawImage(gridCanvas, 0, 0);
  const cxp = AREA.x + AREA.w/2, cyp = AREA.y + AREA.h/2;
  const grad = ctx.createRadialGradient(cxp, cyp, 4, cxp, cyp, Math.max(AREA.w,AREA.h)*0.7);
  grad.addColorStop(0, t.grid + '0.10)');
  grad.addColorStop(1, t.grid + '0)');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  ctx.restore();

  if (G.fillAnim){
    const f = G.fillAnim;
    const a = clamp(1 - f.t, 0, 1);
    ctx.save();
    ctx.globalAlpha = a * 0.9;
    pathPoly(f.poly); ctx.fillStyle = patternFill || t.primary; ctx.fill();
    ctx.globalAlpha = a * 0.55; ctx.lineWidth = 2; ctx.strokeStyle = t.primary; ctx.stroke();
    ctx.globalAlpha = a * 0.5; ctx.fillStyle = t.bg;
    const bandY = AREA.y + AREA.h * f.t;
    ctx.beginPath(); ctx.rect(0, bandY, W, H - bandY); ctx.clip(); ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  for (const w of G.walls){
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.25; ctx.lineWidth = 6; ctx.strokeStyle = t.warning;
    ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 3; ctx.strokeStyle = t.warning;
    ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
    ctx.fillStyle = t.danger;
    ctx.fillRect(Math.round(w.x1)-1, Math.round(w.y1)-1, 2, 2);
    ctx.fillRect(Math.round(w.x2)-1, Math.round(w.y2)-1, 2, 2);
    const phase = Math.sin(G.t*4) * 0.4 + 0.6;
    ctx.globalAlpha = phase * 0.5;
    ctx.lineWidth = 1; ctx.strokeStyle = t.white;
    ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
    ctx.restore();
  }

  pathPoly(G.poly);
  ctx.lineWidth = 7; ctx.strokeStyle = t.grid + '0.07)'; ctx.stroke();
  pathPoly(G.poly);
  ctx.lineWidth = 4; ctx.strokeStyle = t.grid + '0.18)'; ctx.stroke();
  pathPoly(G.poly);
  ctx.lineWidth = 2; ctx.strokeStyle = t.secondary; ctx.stroke();

  drawCornerTicks();
  ctx.restore();

  if (G.cut && (G.state === 'CUTTING' || G.state === 'RETRACTING')) drawCutLine();

  if (G.state !== 'MENU'){ drawEnemies(); drawPlayer(); }
  else { drawEnemies(0.75); }

  drawPowerUps();
  drawParticles();
}

function drawCornerTicks(){
  const p = G.poly; const t = TH();
  for (let i=0;i<p.length;i+=Math.max(3, Math.floor(p.length/7))){
    const a = p[i], b = p[(i+1)%p.length];
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    let dx = b.x-a.x, dy = b.y-a.y;
    const l = Math.hypot(dx,dy)||1; dx/=l; dy/=l;
    ctx.strokeStyle = t.grid + '0.55)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Math.round(mx - dx*3), Math.round(my - dy*3));
    ctx.lineTo(Math.round(mx + dx*3), Math.round(my + dy*3));
    ctx.stroke();
  }
}

function drawCutLine(){
  const c = G.cut;
  const t = TH();
  let minD = Infinity;
  for (const e of G.enemies){
    for (let i=1;i<c.path.length;i++){
      const a = c.path[i-1], b = c.path[i];
      const d = distToSeg(e.x, e.y, a.x, a.y, b.x, b.y);
      if (d < minD) minD = d;
    }
  }
  const danger = minD < 28;
  const col = danger ? t.danger : t.warning;

  ctx.save();
  ctx.lineCap = 'butt';

  ctx.globalAlpha = 0.10;
  ctx.lineWidth = 4;
  ctx.strokeStyle = t.secondary;
  ctx.setLineDash([2,4]);
  ctx.beginPath();
  let started = false;
  for (let i=0;i<c.path.length;i++){
    const segStart = c.cum[i];
    if (i === 0 || segStart <= c.progress){
      if (!started && i > 0 && c.cum[i-1] < c.progress){
        const pp = getCutPos(c, c.progress);
        ctx.moveTo(pp.x, pp.y);
        started = true;
      } else if (!started){
        ctx.moveTo(c.path[0].x, c.path[0].y);
        started = true;
      }
      if (c.cum[i] >= c.progress) {
        const pp = getCutPos(c, c.progress);
        ctx.lineTo(pp.x, pp.y);
      } else {
        ctx.lineTo(c.path[i].x, c.path[i].y);
      }
    } else {
      if (!started){
        const pp = getCutPos(c, c.progress);
        ctx.moveTo(pp.x, pp.y);
        started = true;
      }
      ctx.lineTo(c.path[i].x, c.path[i].y);
    }
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  ctx.globalAlpha = 0.28; ctx.lineWidth = 7; ctx.strokeStyle = col;
  drawCutActivePath(c, c.progress);
  ctx.globalAlpha = 1; ctx.lineWidth = 2; ctx.strokeStyle = col;
  drawCutActivePath(c, c.progress);

  ctx.setLineDash([3,4]); ctx.lineDashOffset = -G.t*22;
  ctx.lineWidth = 1; ctx.strokeStyle = t.white; ctx.globalAlpha = 0.9;
  drawCutActivePath(c, c.progress);
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  ctx.fillStyle = t.secondary;
  ctx.fillRect(Math.round(c.ox)-2, Math.round(c.oy)-2, 4, 4);
  ctx.fillStyle = t.bg;
  ctx.fillRect(Math.round(c.ox)-1, Math.round(c.oy)-1, 2, 2);

  for (let i=1;i<c.path.length-1;i++){
    const p = c.path[i];
    if (c.cum[i] <= c.progress){
      ctx.fillStyle = t.secondary;
      ctx.fillRect(Math.round(p.x)-2, Math.round(p.y)-2, 4, 4);
      ctx.fillStyle = t.bg;
      ctx.fillRect(Math.round(p.x)-1, Math.round(p.y)-1, 2, 2);
    }
  }

  const pp = getCutPos(c, c.progress);
  ctx.fillStyle = danger ? t.danger : t.warning;
  ctx.fillRect(Math.round(pp.x)-2, Math.round(pp.y)-2, 4, 4);

  ctx.restore();
}
function drawCutActivePath(c, to){
  ctx.beginPath();
  let started = false;
  const cum = c.cum;
  for (let i=0;i<c.path.length;i++){
    if (cum[i] > to){
      if (!started){ ctx.moveTo(c.path[0].x, c.path[0].y); started = true; }
      const tt = (to - cum[i-1]) / Math.max(0.0001, cum[i] - cum[i-1]);
      const a = c.path[i-1], b = c.path[i];
      ctx.lineTo(a.x + (b.x-a.x)*tt, a.y + (b.y-a.y)*tt);
      break;
    }
    if (!started){ ctx.moveTo(c.path[i].x, c.path[i].y); started = true; }
    else ctx.lineTo(c.path[i].x, c.path[i].y);
  }
  ctx.stroke();
}

function drawPowerUps(){
  const t = TH();
  for (const p of G.powerUps){
    const x = Math.round(p.x), y = Math.round(p.y);
    const bob = Math.sin(p.phase)*2;
    const pulse = 0.6 + 0.4*Math.sin(p.phase*1.6);
    ctx.globalAlpha = 0.22 * pulse;
    ctx.fillStyle = p.type === 'SLOW' ? t.secondary : (p.type === 'SHIELD' ? t.primary : t.warning);
    ctx.beginPath(); ctx.arc(x, y+bob, 11, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    const bg = p.type === 'SLOW' ? t.secondary : (p.type === 'SHIELD' ? t.primary : t.warning);
    ctx.fillStyle = bg; ctx.fillRect(x-5, y+bob-5, 10, 10);
    ctx.fillStyle = t.bg; ctx.fillRect(x-4, y+bob-4, 8, 8);
    const letter = p.type[0];
    drawTextC(letter, x, y+bob-3, bg, 1);
  }
}

function drawEnemies(alpha){ for (const e of G.enemies) drawOneEnemy(e, alpha); }
function drawOneEnemy(e, alpha){
  const t = TH();
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;

  const x = Math.round(e.x), y = Math.round(e.y);
  const r = e.r;

  if (e.isBoss){
    const pulse = 1 + Math.sin(G.t*4)*0.08;
    ctx.globalAlpha = (alpha===undefined?1:alpha) * (0.25 + G.slowFx*0.25);
    ctx.fillStyle = t.danger;
    ctx.beginPath(); ctx.arc(x, y, r*1.6*pulse, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = (alpha===undefined?1:alpha);
    ctx.fillStyle = t.danger; ctx.fillRect(x-r, y-r, r*2, r*2);
    ctx.fillStyle = t.bg; ctx.fillRect(x-r+2, y-r+2, r*2-4, r*2-4);
    ctx.fillStyle = t.warning; ctx.fillRect(x-r+3, y-r+3, r*2-6, r*2-6);
    ctx.fillStyle = t.danger; ctx.fillRect(x-r+5, y-r+5, r*2-10, r*2-10);
    ctx.fillStyle = t.white; ctx.fillRect(x-2, y-2, 4, 4);
    ctx.fillStyle = t.danger; ctx.fillRect(x-1, y-1, 2, 2);
    for (let i=0;i<e.maxHp;i++){
      const px = x - (e.maxHp*4)/2 + i*4;
      ctx.fillStyle = i < e.hp ? t.warning : 'rgba(60,20,40,0.8)';
      ctx.fillRect(px, y - r - 6, 3, 3);
    }
    if (G.slowFx > 0.05){
      ctx.globalAlpha = G.slowFx * 0.85;
      ctx.strokeStyle = t.warning; ctx.lineWidth = 1;
      const rr = r + 6 + Math.sin(G.t*14)*1.5;
      ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI*2); ctx.stroke();
    }
  } else if (e.static){
    const ring = 1 + Math.sin(G.t*3 + (e.phase||0))*0.10;
    ctx.globalAlpha = (alpha===undefined?1:alpha) * (0.14 + G.slowFx*0.18);
    ctx.fillStyle = t.warning;
    ctx.beginPath(); ctx.arc(x, y, r*2.4*ring, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = (alpha===undefined?1:alpha);
    ctx.fillStyle = t.warning;
    ctx.fillRect(x - r, y - r, r*2, r*2);
    ctx.fillRect(x - r - 1, y - r + 1, r*2 + 2, r*2 - 2);
    ctx.fillStyle = t.bg;
    ctx.fillRect(x - r + 1, y - r + 1, r*2 - 2, r*2 - 2);
    ctx.fillStyle = t.danger; ctx.fillRect(x - 1, y - 1, 2, 2);
    const rot = G.t*2 + (e.phase||0);
    for (let i=0;i<4;i++){
      const a = rot + i*Math.PI/2;
      const dx = Math.cos(a), dy = Math.sin(a);
      ctx.fillStyle = t.danger;
      ctx.fillRect(x + Math.round(dx*2), y + Math.round(dy*2), 1, 1);
    }
    if (Math.floor(G.t*3)%2 === 0){
      ctx.fillStyle = t.danger;
      ctx.fillRect(x - r - 2, y - r - 2, 1, 1);
      ctx.fillRect(x + r + 1, y - r - 2, 1, 1);
      ctx.fillRect(x - r - 2, y + r + 1, 1, 1);
      ctx.fillRect(x + r + 1, y + r + 1, 1, 1);
    }
    if (G.slowFx > 0.05){
      ctx.globalAlpha = G.slowFx * 0.75;
      ctx.strokeStyle = t.warning; ctx.lineWidth = 1;
      const rr = r + 5 + Math.sin(G.t*14)*1.5;
      ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI*2); ctx.stroke();
    }
  } else {
    const pulse = 1 + Math.sin(G.t*9 + (e.phase||0))*0.18;
    const danger = G.slowFx > 0.3;
    ctx.globalAlpha = (alpha===undefined?1:alpha) * (0.16 + G.slowFx*0.22);
    ctx.fillStyle = t.danger;
    ctx.beginPath(); ctx.arc(x, y, r*2.6*pulse, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = (alpha===undefined?1:alpha);
    ctx.fillStyle = t.danger;
    ctx.beginPath();
    ctx.moveTo(x, y-r-1.5); ctx.lineTo(x+r+1.5, y);
    ctx.lineTo(x, y+r+1.5); ctx.lineTo(x-r-1.5, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = t.bg;
    ctx.beginPath();
    ctx.moveTo(x, y-r+0.5); ctx.lineTo(x+r-0.5, y);
    ctx.lineTo(x, y+r-0.5); ctx.lineTo(x-r+0.5, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = danger ? t.warning : t.white;
    ctx.fillRect(x-1, y-1, 2, 2);
    if (G.slowFx > 0.05){
      ctx.globalAlpha = G.slowFx * 0.85;
      ctx.strokeStyle = t.warning; ctx.lineWidth = 1;
      const rr = r + 5 + Math.sin(G.t*14)*1.5;
      ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI*2); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawPlayer(){
  const t = TH();
  const skin = TRAIL_SKINS[G.trailSkin];
  for (let i=0;i<G.trail.length;i++){
    const tr = G.trail[i];
    const a = (tr.life/0.35) * 0.55;
    ctx.globalAlpha = a;
    ctx.fillStyle = skin.color(t, i);
    const sz = skin.size(i);
    const off = skin.offset();
    ctx.fillRect(Math.round(tr.x)-1+off, Math.round(tr.y)-1+off, sz, sz);
  }
  ctx.globalAlpha = 1;

  for (let a=0;a<G.arrows.length;a++){
    if (a === G.activeArrow) continue;
    const arrow = G.arrows[a];
    const ap = posAt(G.poly, G.cum, arrow.s);
    const ax = Math.round(ap.x), ay = Math.round(ap.y);
    const aAng = Math.atan2(ap.dy, ap.dx);
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(aAng); ctx.globalAlpha = 0.35;
    ctx.fillStyle = t.secondary;
    ctx.beginPath();
    ctx.moveTo(5,0); ctx.lineTo(-3,-3.5); ctx.lineTo(-1,0); ctx.lineTo(-3,3.5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  const x = Math.round(G.player.x);
  const y = Math.round(G.player.y);
  const ang = G.player.angle;

  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.globalAlpha = 0.22; ctx.fillStyle = t.primary;
  ctx.beginPath();
  ctx.moveTo(9,0); ctx.lineTo(-6,-6); ctx.lineTo(-3,0); ctx.lineTo(-6,6); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  const cutting = (G.state === 'CUTTING' || G.state === 'RETRACTING');
  ctx.fillStyle = cutting ? t.warning : t.white;
  ctx.beginPath();
  ctx.moveTo(6.5,0); ctx.lineTo(-4,-4.5); ctx.lineTo(-1.5,0); ctx.lineTo(-4,4.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = cutting ? '#7A5C00' : '#1B2436';
  ctx.beginPath();
  ctx.moveTo(2,0); ctx.lineTo(-2,-1.8); ctx.lineTo(-1,0); ctx.lineTo(-2,1.8); ctx.closePath(); ctx.fill();
  ctx.restore();

  if (G.activeShield > 0){
    ctx.globalAlpha = 0.7 + Math.sin(G.t*8)*0.25;
    ctx.strokeStyle = t.primary; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (G.invuln > 0 && Math.floor(G.t*12)%2 === 0){
    ctx.globalAlpha = 0.45; ctx.strokeStyle = t.danger; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = t.primary;
  ctx.fillRect(x - 1, y - 14, 3, 1);
  ctx.fillRect(x, y - 15, 1, 1);
  ctx.fillStyle = t.secondary;
  ctx.fillRect(x - 1, y - 14, 1, 1);
}

function drawHeart(x, y, filled){
  const t = TH();
  const P = ['.##.##.','#######','#######','.#####.','..###..','...#...'];
  const col = filled ? t.danger : '#2A1524';
  const hi  = filled ? t.warning : '#2A1524';
  for (let r=0;r<6;r++){
    for (let c=0;c<7;c++){
      if (P[r][c] === '#'){
        ctx.fillStyle = (r===1 && (c===1||c===5)) ? hi : col;
        ctx.fillRect(x+c, y+r, 1, 1);
      }
    }
  }
}

function layoutButtons(items, topFrac){
  const bw = Math.min(170, W-40);
  const bh = 20; const gap = 8;
  const totalH = items.length*(bh+gap) - gap;
  let y = H*(topFrac===undefined?0.56:topFrac) - totalH/2;
  return items.map((it,i)=>({
    id: it.id, label: it.label,
    x: Math.round(W/2 - bw/2),
    y: Math.round(y + i*(bh+gap)),
    w: bw, h: bh
  }));
}
function drawButton(b, highlight){
  const t = TH();
  const isHi = highlight || b.hover;

  /* ---- Ad button (amber) ---- */
  if (b.id === 'watchad'){
    const pulse = 0.5 + 0.5*Math.sin(G.t*4);
    ctx.fillStyle = 'rgba(255,180,60,'+(0.18+pulse*0.18)+')';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#FFB43C'; ctx.lineWidth = 1.5;
    ctx.strokeRect(b.x+0.5, b.y+0.5, b.w-1, b.h-1);
    ctx.fillStyle = '#FFD447';
    ctx.fillRect(b.x, b.y, 2, 2); ctx.fillRect(b.x+b.w-2, b.y, 2, 2);
    ctx.fillRect(b.x, b.y+b.h-2, 2, 2); ctx.fillRect(b.x+b.w-2, b.y+b.h-2, 2, 2);
    drawTextC(b.label, b.x + b.w/2, b.y + Math.round((b.h-7)/2), '#FFD447', 1);
    return;
  }

  /* ---- Loading state (grey, disabled) ---- */
  if (b.id === 'loading'){
    ctx.fillStyle = 'rgba(30,30,50,0.55)';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
    ctx.strokeRect(b.x+0.5, b.y+0.5, b.w-1, b.h-1);
    drawTextC(b.label, b.x + b.w/2, b.y + Math.round((b.h-7)/2), '#999', 1);
    return;
  }

  /* ---- Standard button ---- */
  ctx.fillStyle = isHi ? t.grid + '0.16)' : t.grid + '0.05)';
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = isHi ? t.secondary : '#1E4A63'; ctx.lineWidth = 1;
  ctx.strokeRect(b.x+0.5, b.y+0.5, b.w-1, b.h-1);
  ctx.fillStyle = isHi ? t.primary : '#1E4A63';
  ctx.fillRect(b.x, b.y, 2, 2); ctx.fillRect(b.x+b.w-2, b.y, 2, 2);
  ctx.fillRect(b.x, b.y+b.h-2, 2, 2); ctx.fillRect(b.x+b.w-2, b.y+b.h-2, 2, 2);
  drawTextC(b.label, b.x + b.w/2, b.y + Math.round((b.h-7)/2), isHi ? t.white : '#7FB6D0', 1);
}

    const skin = TRAIL_SKINS[G.trailSkin];
    ctx.fillStyle = skin.color(t, i);
    ctx.fillRect(W/2 - 20 + i*5, swatchY + 46, 3, 3);
  }

  const items = [
    {id:'theme', label:'CHANGE THEME'},
    {id:'trail', label:'NEXT TRAIL SKIN'},
    {id:'sound', label: AudioSys.sfxOn ? 'SOUND: ON' : 'SOUND: OFF'},
    {id:'music', label: AudioSys.musicOn ? 'MUSIC: ON' : 'MUSIC: OFF'},
    {id:'back',  label:'BACK'}
  ];
  G.buttons = layoutButtons(items, 0.72);
  for (const b of G.buttons) drawButton(b, false);
}

function drawLeaderboard(){
  const t = TH();
  ctx.fillStyle = 'rgba(8,11,18,0.90)'; ctx.fillRect(0,0,W,H);
  drawTextC('LEADERBOARD', W/2, 22, t.primary, 2);
  const lb = loadLeaderboard();
  if (lb.length === 0){
    drawTextC('NO SCORES YET', W/2, 80, '#7FB6D0', 1);
  } else {
    for (let i=0;i<lb.length;i++){
      const e = lb[i];
      const yy = 56 + i*22;
      drawText(String(i+1) + '.', 16, yy, t.warning, 1);
      drawText(String(e.score).padStart(6,'0'), 34, yy, t.primary, 1);
      drawText('LV ' + (e.level||1), W - 60, yy, '#7FB6D0', 1);
      drawText(e.date || '', W - 32, yy, '#4A6A80', 1);
    }
  }
  drawTextC('CHALLENGE BEST: ' + String(G.challengeBest).padStart(6,'0'), W/2, H - 60, t.danger, 1);
  const items = [{id:'back', label:'BACK'}];
  G.buttons = layoutButtons(items, 0.86);
  for (const b of G.buttons) drawButton(b, false);
}

/* ============================================================
   GAME OVER SCREEN — with WATCH AD - CONTINUE
   ============================================================ */
function drawGameOver(){
  const t = TH();
  ctx.fillStyle = 'rgba(8,11,18,0.78)'; ctx.fillRect(0,0,W,H);
  const blink = Math.sin(G.t*4) > -0.4;
  drawTextC('GAME OVER', W/2, H*0.18, blink ? t.danger : '#8A1E38', 3);
  drawTextC('SCORE', W/2, H*0.30, '#7FB6D0', 1);
  drawTextC(String(G.score).padStart(6,'0'), W/2, H*0.30 + 12, t.warning, 2);
  drawTextC('LEVEL ' + String(G.level).padStart(2,'0'), W/2, H*0.40, '#7FB6D0', 1);
  drawTextC('BEST', W/2, H*0.44, '#7FB6D0', 1);
  drawTextC(String(G.best).padStart(6,'0'), W/2, H*0.44 + 12, t.primary, 2);

  // Build dynamic button list — ad option appears only if a snapshot exists
  const items = [];
  if (adInProgress){
    items.push({id:'loading', label:'LOADING AD...'});
  } else if (reviveSnapshot){
    items.push({id:'watchad', label:'WATCH AD - CONTINUE'});
  }
  items.push({id:'restart', label:'RESTART'});
  items.push({id:'menu',    label:'MAIN MENU'});

  G.buttons = layoutButtons(items, 0.68);
  for (const b of G.buttons) drawButton(b, false);
}

function drawLevelClear(){
  const t = TH();
  const a = clamp(G.levelClearT/0.6, 0, 1);
  ctx.save(); ctx.globalAlpha = a;
  const y = H*0.34;
  ctx.fillStyle = 'rgba(8,11,18,0.62)';
  ctx.fillRect(0, y-16, W, 60);
  const blink = Math.floor(G.t*10)%2 === 0;
  drawTextC('LEVEL CLEAR', W/2, y-6, blink ? t.primary : '#1E8A50', 2);
  const bonus = 400 + G.level*120;
  drawTextC('+' + bonus, W/2, y + 14, t.warning, 1);
  if (G.comboMax >= 3) drawTextC('MAX COMBO x' + G.comboMax, W/2, y + 26, t.secondary, 1);
  ctx.restore();
}

function drawPauseMenu(){
  const t = TH();
  ctx.fillStyle = 'rgba(8,11,18,0.88)'; ctx.fillRect(0,0,W,H);
  const blink = Math.sin(G.t*3) > -0.6;
  drawTextC('PAUSED', W/2, H*0.14, blink ? t.primary : t.secondary, 3);
  drawTextC('LEVEL ' + String(G.level).padStart(2,'0') + '  ·  SCORE ' + String(G.score).padStart(6,'0'),
            W/2, H*0.24, '#7FB6D0', 1);
  if (G.combo >= 2) drawTextC('COMBO x' + G.combo, W/2, H*0.30, t.primary, 1);

  const items = [
    {id:'resume',   label:'RESUME'},
    {id:'restart',  label:'RESTART LEVEL'},
    {id:'settings', label:'SETTINGS'},
    {id:'quit',     label:'MAIN MENU'}
  ];
  G.buttons = layoutButtons(items, 0.60);
  for (const b of G.buttons) drawButton(b, false);
}

function toLogical(cx, cy){
  const r = canvas.getBoundingClientRect();
  return { x: (cx - r.left) / SCALE, y: (cy - r.top) / SCALE };
}
function hitButton(pt){
  for (const b of G.buttons){
    if (pt.x >= b.x && pt.x <= b.x+b.w && pt.y >= b.y && pt.y <= b.y+b.h) return b;
  }
  return null;
}
function startGame(mode){
  AudioSys.init(); AudioSys.resume(); AudioSys.startMusic();
  reviveSnapshot = null;
  adInProgress = false;
  G.score = 0; G.lives = 3;
  G.combo = 0; G.comboTimer = 0; G.comboMax = 0;
  G.perfectStreak = 0;
  G.challengeMode = mode === 'challenge';
  if (G.challengeMode){
    G.challengeTimer = 60;
    RNG = Math.random;
    startLevel(1);
  } else if (mode === 'daily'){
    G.dailyMode = true;
    const d = new Date();
    const seed = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
    G.seed = seed;
    setSeed(seed);
    startLevel(1, { useSeed: seed });
  } else {
    G.dailyMode = false;
    RNG = Math.random;
    startLevel(1);
  }
  AudioSys.tone(523,0.08,'square',0.055);
  AudioSys.tone(784,0.12,'square',0.055,0.08);
}

/* ============================================================
   REWARDED AD INTEGRATION
   ============================================================ */
function requestRewardedAd(onReward, onFail){
  let adBreakFn = null;
  try {
    if (typeof adBreak === 'function') adBreakFn = adBreak;
    else if (window.parent && window.parent !== window && typeof window.parent.adBreak === 'function') {
      adBreakFn = window.parent.adBreak;
    }
  } catch(e) { adBreakFn = null; }

  if (!adBreakFn){
    console.warn('[NeonFill] adBreak unavailable — check play.html wrapper.');
    onFail && onFail();
    return;
  }

  let rewardGranted = false, finished = false;
  function finish(cb){ if (finished) return; finished = true; cb && cb(); }

  try {
    adBreakFn({
      type: 'reward',
      name: 'resume_after_death',
      beforeAd: () => { try { if (AudioSys.master) AudioSys.master.gain.value = 0.05; } catch(e){} },
      afterAd:  () => { try { if (AudioSys.master) AudioSys.master.gain.value = 0.7;  } catch(e){} },
      beforeReward: (showAdFn) => showAdFn(),
      adViewed:    () => { rewardGranted = true;  finish(onReward); },
      adDismissed: () => { rewardGranted = false; finish(onFail); },
      adBreakDone: (info) => {
        if (!rewardGranted && info && info.breakStatus !== 'viewed') finish(onFail);
        else if (!rewardGranted && !info) finish(onFail);
      }
    });
  } catch(e) {
    console.warn('[NeonFill] adBreak threw:', e);
    finish(onFail);
  }
}

function reviveFromAd(){
  if (!reviveSnapshot) return;
  const s = reviveSnapshot;

  // Restore score / progress state BEFORE rebuilding the level
  // (startLevel doesn't touch these but keep it explicit)
  G.score = s.score;
  G.combo = 0;
  G.comboTimer = 0;
  G.comboMax = s.comboMax;
  G.perfectStreak = s.perfectStreak;
  G.challengeMode = s.challengeMode;
  G.dailyMode = s.dailyMode;
  G.seed = s.seed;
  G.lives = 1;

  // Clear transient state so nothing carries over
  G.cut = null;
  G.fillAnim = null;
  G.particles.length = 0;
  G.trail.length = 0;
  G.killFeed.length = 0;
  G.powerUps.length = 0;
  G.timeScale = 1;
  G.slowFx = 0;
  G.warnBeep = 0;
  G.shake = 0;
  G.hitFlash = 0;
  G.flashWhite = 0;
  G.perfectFlash = 0;
  G.shieldFlash = 0;

  // Rebuild the current level with a fresh layout.
  if (s.dailyMode){
    setSeed(s.seed);
    startLevel(s.level, { useSeed: s.seed });
  } else {
    RNG = Math.random;
    startLevel(s.level);
  }

  // Start level set invuln to 0.5; bump it and give breathing-room buffs
  G.invuln = 2.5;
  G.activeShield = 8.0;
  G.activeFreeze = 2.0;

  if (s.challengeMode){
    G.challengeTimer = Math.max(20, s.challengeTimer);
  }

  AudioSys.tone(880, 0.1, 'square', 0.06);
  AudioSys.tone(1318, 0.15, 'square', 0.06, 0.08);
}

function handleButton(id){
  switch(id){
    case 'start': startGame('normal'); break;
    case 'challenge': startGame('challenge'); break;
    case 'daily': startGame('daily'); break;
    case 'how': G.prevState = 'MENU'; G.state = 'HOWTO'; break;
    case 'settings':
      G.settingsReturn = (G.state === 'PAUSED') ? 'PAUSED' : 'MENU';
      G.state = 'SETTINGS'; break;
    case 'leaderboard':
      G.leaderboardReturn = 'MENU'; G.state = 'LEADERBOARD'; break;
    case 'theme':
      THEME_IDX = (THEME_IDX + 1) % THEMES.length;
      applyTheme();
      try{ localStorage.setItem('neonfill_theme', String(THEME_IDX)); }catch(e){}
      AudioSys.tone(880,0.07,'square',0.05);
      AudioSys.tone(1175,0.09,'square',0.045,0.06);
      break;
    case 'trail':
      G.trailSkin = (G.trailSkin + 1) % TRAIL_SKINS.length;
      try{ localStorage.setItem('neonfill_trail', String(G.trailSkin)); }catch(e){}
      AudioSys.tone(660,0.05,'square',0.04);
      break;
    case 'sound':
      AudioSys.sfxOn = !AudioSys.sfxOn;
      if (AudioSys.sfxOn){ AudioSys.init(); AudioSys.resume(); AudioSys.tone(880,0.07,'square',0.05); }
      break;
    case 'music': AudioSys.musicOn = !AudioSys.musicOn; break;
    case 'back':
      if (G.state === 'LEADERBOARD') G.state = 'MENU';
      else G.state = G.settingsReturn || 'MENU';
      break;
    case 'resume': G.state = 'PLAYING'; break;
    case 'restart':
      G.challengeMode = false;
      startGame('normal'); break;
    case 'quit': G.state = 'MENU'; break;
    case 'menu': G.state = 'MENU'; break;

    /* ---- REWARDED AD ---- */
    case 'watchad':
      if (adInProgress || !reviveSnapshot) break;
      adInProgress = true;
      AudioSys.tone(660, 0.08, 'square', 0.05);
      requestRewardedAd(
        function(){ adInProgress = false; reviveFromAd(); },
        function(){ adInProgress = false; }
      );
      break;
    case 'loading':
      // no-op — button is disabled while an ad is loading
      break;
  }
}

function onPointerDown(e){
  e.preventDefault();

  // Block input while an ad is loading (game over screen only)
  if (adInProgress && G.state === 'GAME_OVER') return;

  AudioSys.init(); AudioSys.resume(); AudioSys.startMusic();
  G.touchActive = true;
  const t = (e.touches && e.touches[0]) ? e.touches[0] : e;
  const pt = toLogical(t.clientX, t.clientY);

  if (G.state === 'MENU' || G.state === 'HOWTO' || G.state === 'SETTINGS'
      || G.state === 'GAME_OVER' || G.state === 'PAUSED' || G.state === 'LEADERBOARD'){
    const b = hitButton(pt);
    if (b) handleButton(b.id);
    return;
  }
  if (G.state === 'PLAYING' || G.state === 'CUTTING' || G.state === 'RETRACTING' || G.state === 'FILLING'){
    const r = getPauseBtnRect();
    if (pt.x >= r.hx && pt.x <= r.hx + r.hw && pt.y >= r.hy && pt.y <= r.hy + r.hh){
      if (G.state === 'CUTTING') releaseCut();
      G.prevState = G.state;
      G.state = 'PAUSED';
      AudioSys.stopCut();
      return;
    }
  }
  if (G.state === 'PLAYING'){ launchCut(); }
}
function onPointerUp(e){
  e.preventDefault();
  G.touchActive = false;
  if (G.state === 'CUTTING') releaseCut();
}

/* ============================================================
   KEYBOARD — Spacebar robustly handled with auto-repeat guard
   ============================================================ */
function isSpaceKey(e){
  return e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar' || e.keyCode === 32;
}
window.addEventListener('keydown', (e)=>{
  if (isSpaceKey(e)){
    e.preventDefault();
    e.stopPropagation();
    if (e.repeat || G.spaceHeld) return;
    G.spaceHeld = true;

    // Block spacebar on game over while ad is loading
    if (adInProgress && G.state === 'GAME_OVER') return;

    AudioSys.init(); AudioSys.resume(); AudioSys.startMusic();

    if (G.state === 'MENU'){ handleButton('start'); return; }
    if (G.state === 'GAME_OVER'){ handleButton('restart'); return; }
    if (G.state === 'PAUSED'){ handleButton('resume'); return; }
    if (G.state === 'HOWTO' || G.state === 'SETTINGS' || G.state === 'LEADERBOARD'){
      G.state = 'MENU'; return;
    }
    if (G.state === 'PLAYING'){ launchCut(); return; }
    return;
  }
  if (e.code === 'Tab'){
    e.preventDefault();
    if (G.state === 'PLAYING' || G.state === 'CUTTING' || G.state === 'RETRACTING'){
      if (G.state === 'CUTTING') return;
      G.arrows[G.activeArrow].active = false;
      G.activeArrow = (G.activeArrow + 1) % G.arrows.length;
      G.arrows[G.activeArrow].active = true;
      syncPlayer();
      AudioSys.tone(660, 0.05, 'square', 0.05);
      AudioSys.tone(880, 0.06, 'square', 0.05, 0.05);
    }
    return;
  }
  if (e.code === 'Escape'){
    e.preventDefault();
    if (G.state === 'PLAYING' || G.state === 'CUTTING' || G.state === 'RETRACTING' || G.state === 'FILLING'){
      if (G.state === 'CUTTING') releaseCut();
      G.prevState = G.state;
      G.state = 'PAUSED';
      AudioSys.stopCut();
    } else if (G.state === 'PAUSED'){ G.state = 'PLAYING'; }
    else if (G.state === 'HOWTO' || G.state === 'SETTINGS' || G.state === 'LEADERBOARD'){
      G.state = 'MENU';
    }
    return;
  }
  if (e.code === 'KeyR'){
    if (G.state !== 'MENU'){
      G.challengeMode = false;
      startGame('normal');
    }
    return;
  }
  if (e.code === 'KeyM'){ AudioSys.musicOn = !AudioSys.musicOn; }
  if (e.code === 'KeyT'){
    THEME_IDX = (THEME_IDX + 1) % THEMES.length;
    applyTheme();
    try{ localStorage.setItem('neonfill_theme', String(THEME_IDX)); }catch(e){}
  }
});
window.addEventListener('keyup', (e)=>{
  if (isSpaceKey(e)){
    e.preventDefault();
    e.stopPropagation();
    G.spaceHeld = false;
    if (G.state === 'CUTTING') releaseCut();
  }
});

canvas.addEventListener('mousedown', (e)=>{ if (e.button === 0) onPointerDown(e); });
window.addEventListener('mouseup', (e)=>{ if (e.button === 0) onPointerUp(e); });
canvas.addEventListener('touchstart', onPointerDown, {passive:false});
window.addEventListener('touchend', onPointerUp, {passive:false});
window.addEventListener('touchcancel', onPointerUp, {passive:false});
canvas.addEventListener('contextmenu', (e)=>e.preventDefault());
window.addEventListener('blur', ()=>{
  G.spaceHeld = false;
  if (G.state === 'CUTTING') releaseCut();
  AudioSys.stopCut();
});

let lastTs = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs)/1000;
  lastTs = ts;
  if (dt > 0.06) dt = 0.06;
  if (dt < 0) dt = 0;
  tick(dt);
  render();
}

function boot(){
  try{ G.best = parseInt(localStorage.getItem('neonfill_best')||'0',10) || 0; }catch(e){ G.best = 0; }
  try{ G.challengeBest = parseInt(localStorage.getItem('neonfill_chbest')||'0',10) || 0; }catch(e){ G.challengeBest = 0; }
  try{
    const st = parseInt(localStorage.getItem('neonfill_theme')||'0',10);
    if (!isNaN(st) && st >= 0 && st < THEMES.length) THEME_IDX = st;
  }catch(e){}
  try{
    const sk = parseInt(localStorage.getItem('neonfill_trail')||'0',10);
    if (!isNaN(sk) && sk >= 0 && sk < TRAIL_SKINS.length) G.trailSkin = sk;
  }catch(e){}
  document.body.style.background = TH().bg;
  resize();
  applyTheme();
  startLevel(1);
  G.state = 'MENU';
  G.score = 0; G.lives = 3;
  requestAnimationFrame(loop);
}

window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{ resize(); }, 120);
});
window.addEventListener('orientationchange', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{ resize(); }, 260);
});

boot();
</script>
